# Capture panel and exome kit presets for scripts/setup_project.py
# (option --panel <name>; list them with --list-panels).
#
# Keys
#   kind         panel (use with --seq-type PANEL) | exome (use with --seq-type WES)
#   ref          the build the BED files are in; setup_project.py stops if
#                --ref differs
#   species      human | mouse
#   description  one line
#   targets_file panel: written as targets_file (TARGETS_FILE; also sets
#                CHROMOSOMES and the calling intervals)
#                exome: written as exome_bed (the genome include then sets
#                TARGETS_FILE = EXOME_BED because seq_type WES sets EXOME = true)
#   targets_list Picard interval list for qc/bam_metrics.mk CollectHsMetrics
#                (TARGETS_LIST). Without it bam_metrics uses its built-in
#                default MSK-IMPACT-v4.sorted.list, an older IMPACT version.
#   ontarget_file / offtarget_file  CNVkit target and antitarget BEDs
#                (copy_number/cnvkit.mk). null = no CNVkit BEDs for this panel.
#   facets       pre_cval / cval1 / cval2 / min_nhet
#   source_projects  lab projects on lilac that used this preset (read only)
#   alternatives other BED files that exist for the same panel, and why the
#                preset does not use them
#   notes        shown in SETUP_NOTES.md
#
# Every path was checked on lilac with `ls -la` on 2026-11-24 (read only).
# Contig names of all b37 BEDs below: 1..22 X Y (no chr prefix), the same as
# ~/share/reference/b37_dmp/b37.fasta.

IMPACT505:
  kind: panel
  ref: b37
  species: human
  description: "MSK-IMPACT 505 genes (current IMPACT version)"
  targets_file: ~/share/lib/bed_files/targets/IMPACT505/b37/IMPACT505_b37_targets.bed
  targets_list: ~/share/lib/bed_files/targets/IMPACT505/b37/IMPACT505_b37_targets.list
  ontarget_file: ~/share/lib/bed_files/IMPACT505_b37_CNVkit_on-target.bed
  offtarget_file: ~/share/lib/bed_files/IMPACT505_b37_CNVkit_off-target.bed
  facets: {pre_cval: 50, cval1: 150, cval2: 50, min_nhet: 25}
  source_projects:
    - /data/riazlab/projects/peix/parejaf/late_mosaicism/pipeline_runs (targets BED + targets list)
    - /data/reis-filho/data/selenicp/MSK_IMPACT_synchronous_pair (impact505.bed)
    - /data/reis-filho/data/selenicp/MSK_IMPACT_pole_herman (impact505.bed)
  alternatives:
    - "~/share/reference/target_panels/impact505.bed: the bait tiling (39,012 overlapping probes, 4.68 Mb summed length), used by the selenicp IMPACT505 projects. The targets BED above has 9,360 regions, 2.01 Mb."
  notes:
    - "Panel BED choice: the late_mosaicism project chose the targets BED; the selenicp projects use the bait tiling impact505.bed. Decide which one this project uses and keep it for all batches."
    - "qc/bam_interval_metrics.mk already defaults to the IMPACT505 baits and targets lists (genome_inc/b37.inc)."

