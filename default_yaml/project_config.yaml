---
cluster_engine: LSF ## PBS ## SGE

use_cluster: true

ref: b37 ## hg19 ## hg38 ## GRCm38 (mouse)

# sequencing type: WGS, WES or PANEL. Sets EXOME, Manta --exome and the
# resource profile (config/profiles/). It is empty on purpose: set it for
# every new project (make prints a warning while it is unset). The FACETS
# values below (50/150/50) suit WES and panels; WGS uses 700/750/700.
# scripts/setup_project.py writes a complete config for each case.
# See modules/_docs/mouse_and_seq_type_config.md
seq_type: ## WGS ## WES ## PANEL

aligner: bwamem ## tophat ## hisat ## bwa ## bowtie ## tmap
bam_chr1_base_recal: true
bam_dup_type: markdup
bam_no_filter: false
bam_no_recal: false
bam_no_realn: false
bam_no_sort: false
bam_fix_rg: false
bam_phred64: false
bam_reprocess: false

# false for FASTQ input: true makes `make bwamem` stop with "No rule to make
# target 'unprocessed_bam/<sample>.bam'" with make 3.82 (lilac default; checked
# 2026-11-24). The lab projects on lilac do not set it (default false).
merge_split_bams: false

snv_type: mutect # or mutect_snps
mutect_split_chr: true
mutect_use_contest: false
# lancet_indels is off by default (slow: 24 h for one human chromosome); add it if needed
indel_types: varscan_indels strelka_indels scalpel_indels platypus_indels #lancet_indels pindel mutect_indels to use mutect2

vcf_post_ann_filter_expression: ExAC_AF > 0.01

# vcf annotations
ann_facets: true
ann_mut_taste: false
ann_provean: false
ann_pathogen: true

# target panels: BED of the capture targets. For seq_type WES the genome
# include sets it to the exome BED; for PANEL set it to the panel BED.
# The placeholder below is a directory: replace it with a BED file or delete it.
targets_file: ~/share/reference/target_panels/
# WGS example used by lab WGS projects (whole-genome BED, for chunking):
# targets_file: ~/share/reference/target_panels/whole_genome_1indexed_nochr_scalpel.bed

# gatk options
gatk_hard_filter_snps: true
gatk_pool_snp_recal: false

# facets options
# pre-processing crit val
facets_pre_cval: 50
# crit val for estimating diploid log ratio
facets_cval1: 150
# starting crit val for segmentation 
facets_cval2: 50
# min number of het snps in a segment used for bivariate t-statistic during clustering of segement
facets_min_nhet: 25
# union of gatk and dbsnp for snp-pileup
facets_union_gatk_dbsnp: false
# WGS example used by lab WGS projects:
# facets_pre_cval: 700
# facets_cval1: 750
# facets_cval2: 700

# slack_channel: 

qsub_priority: 0
...
